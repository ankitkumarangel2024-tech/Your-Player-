<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#04060c">
<title>Your Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;800&family=Unbounded:wght@500;700&display=swap">
<style>
:root{
  --ink:#04060c;--text:#eaf7ff;--muted:#9bb2c8;--h:200;
  --glow:hsl(var(--h) 100% 70%);--glow2:hsl(calc(var(--h) + 70) 95% 70%);
  --edge:rgba(255,255,255,.22);
  --font-display:'Unbounded','Trebuchet MS',system-ui,sans-serif;
  --font-body:'Outfit',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
html.playing,html.playing body{background:transparent}
html.playing #home,html.playing .orbs{visibility:hidden}
body{margin:0;background:var(--ink);color:var(--text);font:500 15px/1.45 var(--font-body);overflow:hidden;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button,label,input{font:inherit;color:inherit}
svg{display:block}
[hidden]{display:none!important}
.s{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.f{fill:currentColor}

/* colour behind the glass (static = cheap) */
.orbs{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(60vmax 60vmax at 0% 0%,hsl(var(--h) 95% 55%/.42),transparent 62%),
    radial-gradient(55vmax 55vmax at 100% 35%,hsl(calc(var(--h) + 70) 90% 58%/.32),transparent 62%),
    radial-gradient(60vmax 60vmax at 10% 100%,hsl(calc(var(--h) - 60) 90% 52%/.3),transparent 62%)}

/* liquid glass material (no live blur, so lists stay smooth) */
.glass{position:relative;border:1px solid var(--edge);
  background:linear-gradient(140deg,rgba(255,255,255,.16),rgba(255,255,255,.04) 62%),rgba(20,28,50,.45);
  box-shadow:inset 1.5px 1.5px 0 rgba(255,255,255,.5),inset -1px -1px 0 rgba(140,215,255,.24),inset 0 0 22px rgba(255,255,255,.05),0 14px 34px rgba(0,0,0,.34)}

/* buttons */
.btn{appearance:none;border:0;cursor:pointer;position:relative;display:grid;place-items:center;width:48px;height:48px;border-radius:50%;
  color:var(--text);transition:transform .22s cubic-bezier(.3,1.7,.5,1),color .3s;flex:none}
.btn:active{transform:scale(.88)}
.btn svg{width:22px;height:22px;position:relative;z-index:1}
.btn::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0}
.btn.on{color:var(--glow)}
.btn.on::before{opacity:1;box-shadow:0 0 16px 1px var(--glow),inset 0 0 10px hsl(var(--h) 100% 70%/.35)}
.btn.glow::before{animation:ring .8s ease-out}
@keyframes ring{0%{opacity:1;box-shadow:0 0 0 0 var(--glow),0 0 20px 3px var(--glow)}100%{opacity:0;box-shadow:0 0 0 16px transparent,0 0 46px 14px transparent}}
.btn.big{width:76px;height:76px;color:var(--text);background:linear-gradient(140deg,rgba(255,255,255,.2),rgba(255,255,255,.03) 62%);border:1px solid rgba(255,255,255,.32);
  box-shadow:inset 1.5px 1.5px 0 rgba(255,255,255,.55),inset -1px -1px 0 rgba(140,215,255,.3),0 0 30px -6px var(--glow)}
.btn.big svg{width:32px;height:32px;filter:drop-shadow(0 0 8px var(--glow))}
.btn.mid{width:56px;height:56px}
.btn.mid svg{width:26px}

/* ---------- home ---------- */
#home{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + 18px) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}
.logo{margin:0;font:700 clamp(24px,7.5vw,32px)/1 var(--font-display);letter-spacing:-.02em}
.logo span{background:linear-gradient(90deg,var(--glow),var(--glow2));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 12px hsl(var(--h) 100% 65%/.55))}
.top p{margin:7px 0 0;color:var(--muted);font-weight:600;font-size:13px}
.add{height:48px;padding:0 20px 0 16px;border-radius:99px;display:flex;align-items:center;gap:8px;font-weight:800;cursor:pointer;flex:none;color:var(--text);
  background:linear-gradient(140deg,rgba(255,255,255,.2),rgba(255,255,255,.03) 62%);border:1px solid rgba(255,255,255,.3);
  box-shadow:inset 1.5px 1.5px 0 rgba(255,255,255,.55),inset -1px -1px 0 rgba(140,215,255,.3),0 0 22px -8px var(--glow),0 10px 26px rgba(0,0,0,.25);
  transition:transform .2s cubic-bezier(.3,1.7,.5,1),box-shadow .3s}
.add:active{transform:scale(.93);box-shadow:inset 1.5px 1.5px 0 rgba(255,255,255,.55),0 0 26px 0 var(--glow)}
.add svg{color:var(--glow);filter:drop-shadow(0 0 6px var(--glow))}
.add svg{width:20px;height:20px}
#scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 24px);scrollbar-width:none;overscroll-behavior:contain}
#scroll::-webkit-scrollbar{display:none}
#list{display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none}
.rw{display:flex;align-items:stretch;border-radius:24px;overflow:hidden;content-visibility:auto;contain-intrinsic-size:auto 92px}
.rm{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:10px 4px 10px 10px;border:0;background:none;text-align:left;cursor:pointer}
.th{position:relative;width:118px;aspect-ratio:16/9;border-radius:16px;flex:none;overflow:hidden;
  background:linear-gradient(135deg,hsl(var(--t,200) 85% 52%),hsl(calc(var(--t,200) + 60) 80% 34%));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.th svg{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;color:rgba(255,255,255,.85);filter:drop-shadow(0 0 8px rgba(0,0,0,.4))}
.th em{position:absolute;right:6px;bottom:5px;font:800 11px/1 var(--font-body);font-style:normal;padding:3px 6px;border-radius:8px;background:rgba(0,0,0,.55);font-variant-numeric:tabular-nums}
.rt{flex:1;min-width:0}
.rt b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:800;line-height:1.3;word-break:break-word}
.rt span{display:block;margin-top:4px;color:var(--muted);font-size:12.5px;font-weight:600}
.x{border:0;background:none;color:var(--muted);width:44px;flex:none;display:grid;place-items:center;cursor:pointer}
.x svg{width:18px;height:18px}
.empty{margin-top:8vh;padding:34px 22px;border-radius:32px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.empty .ico{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;color:#04101a;background:linear-gradient(145deg,var(--glow),var(--glow2));box-shadow:0 0 40px -4px var(--glow),inset 0 2px 0 rgba(255,255,255,.7)}
.empty .ico svg{width:36px;height:36px;margin-left:4px}
.empty h3{margin:0;font:700 18px/1.3 var(--font-display)}
.empty p{margin:0;color:var(--muted);max-width:30ch}
.perm{margin:6vh 0 0;padding:22px 18px;border-radius:28px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.perm p{margin:0;color:var(--muted);max-width:30ch}
.note{margin:16px 6px 0;color:var(--muted);font-size:12px;font-weight:600;text-align:center;opacity:.8}

/* ---------- player ---------- */
#pl{position:fixed;inset:0;z-index:50;background:transparent;visibility:hidden;touch-action:none}
#pl.open{visibility:visible}
#dim{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
#g{position:absolute;inset:0;touch-action:none}
.hint{position:absolute;top:0;bottom:0;width:34%;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0}
.hint.l{left:0}.hint.r{right:0}
.hint div{padding:12px 18px;border-radius:99px;font-weight:800;font-size:15px;display:flex;gap:8px;align-items:center}
.hint.show{animation:hint .6s ease-out}
@keyframes hint{0%{opacity:0;transform:scale(.8)}25%{opacity:1;transform:scale(1)}100%{opacity:0}}
#hud{position:absolute;left:50%;top:18%;transform:translateX(-50%);min-width:96px;padding:8px 14px;border-radius:20px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;
  font-weight:800;font-variant-numeric:tabular-nums;opacity:0;pointer-events:none;transition:opacity .15s}
#hud.show{opacity:1}
#hud svg{width:15px;height:15px}
#hud .lv{width:84px;height:3px;border-radius:9px;background:rgba(255,255,255,.22);overflow:hidden}
#hud .lv i{display:block;height:100%;width:50%;border-radius:inherit;background:linear-gradient(90deg,var(--glow),var(--glow2));box-shadow:0 0 10px var(--glow)}
#boost{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translateX(-50%);padding:9px 18px;border-radius:99px;font:800 14px/1 var(--font-body);
  display:none;align-items:center;gap:8px;color:var(--glow)}
#boost.show{display:flex}
#boost svg{width:18px;height:18px}

#ctl{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .28s;
  background:linear-gradient(180deg,rgba(0,0,0,.62),transparent 26%,transparent 62%,rgba(0,0,0,.72))}
#pl.ui #ctl{opacity:1}
#pl.ui #ctl .btn,#pl.ui #ctl .bar,#pl.ui #ctl .chip,#pl.ui #spd{pointer-events:auto}
.bar{display:flex;align-items:center;gap:10px}
#tb{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px))}
#tb h2{flex:1;min-width:0;margin:0;font:700 15px/1.3 var(--font-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 10px rgba(0,0,0,.6)}
#tb .btn{width:44px;height:44px}
#mid{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);display:flex;align-items:center;justify-content:center;gap:clamp(18px,8vw,44px)}
#bt{position:absolute;left:0;right:0;bottom:0;padding:0 max(18px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 14px) max(18px,env(safe-area-inset-left,0px))}
.tm{font:700 12.5px/1 var(--font-body);font-variant-numeric:tabular-nums;min-width:44px;text-shadow:0 1px 8px rgba(0,0,0,.7)}
.tm.r{text-align:right}
#sk{flex:1;height:44px;position:relative;cursor:pointer;touch-action:none}
#sk .tr{position:absolute;left:0;right:0;top:50%;height:4px;margin-top:-2px;border-radius:9px;background:rgba(255,255,255,.22)}
#sk .fl{position:absolute;left:0;top:50%;height:4px;margin-top:-2px;width:0;border-radius:9px;background:linear-gradient(90deg,var(--glow),var(--glow2));box-shadow:0 0 12px var(--glow)}
#sk .bd{position:absolute;top:50%;left:0;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#fff;box-shadow:0 0 14px 3px var(--glow);transition:width .15s,height .15s,margin .15s}
#sk.drag .bd{width:22px;height:22px;margin:-11px 0 0 -11px}
#row2{display:flex;justify-content:flex-end;gap:10px;margin-top:2px}
.chip{height:38px;padding:0 16px;border-radius:99px;border:0;font-weight:800;font-size:13px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;color:var(--text)}
#spd{position:absolute;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 112px);padding:8px;border-radius:26px;display:none;gap:6px;flex-wrap:wrap;max-width:230px;justify-content:center}
#spd.show{display:flex}
#spd button{height:38px;min-width:58px;border:0;border-radius:99px;background:rgba(255,255,255,.08);font-weight:800;font-size:13px;cursor:pointer;color:var(--text)}
#spd button.on{background:linear-gradient(145deg,var(--glow),var(--glow2));color:#04101a}
#pl.pip #ctl,#pl.pip #hud,#pl.pip #boost,#pl.pip #spd,#pl.pip .hint{display:none!important}

.toast{position:fixed;z-index:80;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translateX(-50%);padding:10px 18px;border-radius:99px;font-weight:700;font-size:14px;max-width:calc(100vw - 40px);text-align:center;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* tabs */
.tabs{display:flex;gap:8px;margin:0 0 12px}
.tabs button{flex:1;height:40px;border-radius:99px;border:1px solid var(--edge);background:rgba(255,255,255,.06);font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--muted);cursor:pointer}
.tabs button svg{width:16px;height:16px}
.tabs button.on{color:var(--text);background:linear-gradient(140deg,rgba(255,255,255,.2),rgba(255,255,255,.05));box-shadow:inset 1.5px 1.5px 0 rgba(255,255,255,.4),0 0 18px -6px var(--glow)}
.fd .th{display:grid;place-items:center;aspect-ratio:auto;width:64px;height:64px;border-radius:18px}
.fd .th svg{position:static;margin:0;width:28px;height:28px}
.crumb{display:flex;align-items:center;gap:10px;margin:0 0 12px;font-weight:800}
.crumb .btn{width:40px;height:40px}
.pg{height:3px;margin-top:7px;border-radius:9px;background:rgba(255,255,255,.16);overflow:hidden}
.pg i{display:block;height:100%;background:linear-gradient(90deg,var(--glow),var(--glow2))}
/* sheet + lock */
#sheet{position:absolute;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 112px);width:min(300px,80vw);max-height:60vh;overflow:auto;padding:8px;border-radius:24px;display:none;flex-direction:column;gap:4px}
#sheet.show{display:flex}
#pl.ui #sheet{pointer-events:auto}
#sheet h4{margin:6px 10px 4px;font:700 12px/1 var(--font-display);color:var(--muted)}
#sheet button{min-height:42px;border:0;border-radius:16px;background:rgba(255,255,255,.07);padding:0 14px;text-align:left;font-weight:700;font-size:14px;cursor:pointer;color:var(--text)}
#sheet button.on{background:rgba(255,255,255,.2);box-shadow:inset 0 0 0 1px var(--glow)}
#sheet p{margin:8px 10px;color:var(--muted);font-size:13px}
.chip svg{width:18px;height:18px}
#err{position:absolute;left:16px;right:16px;top:42%;z-index:8;text-align:center;font:600 13px/1.4 var(--font-body);color:#ffd7d7;background:rgba(0,0,0,.55);padding:10px 12px;border-radius:14px;pointer-events:none;word-break:break-word}
#lk{position:absolute;inset:0;display:none;z-index:9}
#pl.lock #lk{display:block}
#pl.lock #ctl,#pl.lock #g,#pl.lock .hint,#pl.lock #hud{display:none}
#ulk{position:absolute;right:calc(env(safe-area-inset-right,0px) + 14px);top:calc(env(safe-area-inset-top,0px) + 14px);width:40px;height:40px;border-radius:50%;display:grid;place-items:center;padding:0;opacity:.4;border:0;color:var(--text);cursor:pointer;z-index:10}
#ulk.show{opacity:.95}
#ulk svg{width:18px;height:18px}

/* transparent glass controls inside the player */
#ctl .btn.glass,#ctl .chip.glass,#ctl .btn.big{background:rgba(255,255,255,.07)!important;border:1px solid rgba(255,255,255,.3)!important;
  box-shadow:inset 1px 1px 0 rgba(255,255,255,.4),inset -1px -1px 0 rgba(140,215,255,.2)!important}
#ctl .btn svg,#ctl .chip svg{filter:drop-shadow(0 1px 4px rgba(0,0,0,.7))}
#pl.open ~ .toast{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 150px);padding:8px 14px;font-size:13px}
#ulk{background:rgba(255,255,255,.12)!important}
#mid .btn,#mid .btn.glass,#mid .btn.big{background:rgba(255,255,255,.05)!important;box-shadow:inset 0 0 0 1px rgba(255,255,255,.4)!important;border:0!important;-webkit-backdrop-filter:none;backdrop-filter:none}
#mid .btn.big{box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.5),0 0 22px -8px var(--glow)!important}
#mid .btn,#mid .btn.big{background:rgba(255,255,255,.07)!important;border:1px solid rgba(255,255,255,.4)!important;box-shadow:none!important;-webkit-backdrop-filter:none;backdrop-filter:none}
#mid .btn::before{display:none}
#mid .btn svg{filter:drop-shadow(0 1px 6px rgba(0,0,0,.7))}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-play" viewBox="0 0 24 24"><path class="f" d="M7 4.5v15a1 1 0 0 0 1.5.86l12-7.5a1 1 0 0 0 0-1.72l-12-7.5A1 1 0 0 0 7 4.5z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><rect class="f" x="6" y="4.5" width="4.4" height="15" rx="1.4"/><rect class="f" x="13.6" y="4.5" width="4.4" height="15" rx="1.4"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path class="f" d="M6 5.2v13.6a.9.9 0 0 0 1.4.75l9-6.8a.9.9 0 0 0 0-1.5l-9-6.8A.9.9 0 0 0 6 5.2z"/><rect class="f" x="17" y="5" width="2.6" height="14" rx="1.2"/></symbol>
  <symbol id="i-prev" viewBox="0 0 24 24"><path class="f" d="M18 5.2v13.6a.9.9 0 0 1-1.4.75l-9-6.8a.9.9 0 0 1 0-1.5l9-6.8A.9.9 0 0 1 18 5.2z"/><rect class="f" x="4.4" y="5" width="2.6" height="14" rx="1.2"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path class="s" d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path class="s" d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path class="s" d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-pip" viewBox="0 0 24 24"><rect class="s" x="3" y="5" width="18" height="14" rx="3"/><rect class="f" x="12" y="11" width="7" height="5" rx="1.4"/></symbol>
  <symbol id="i-rot" viewBox="0 0 24 24"><rect class="s" x="3" y="7" width="18" height="10" rx="2.5"/><path class="s" d="M12 3.5v2M8 20.5h8"/></symbol>
  <symbol id="i-fwd" viewBox="0 0 24 24"><path class="f" d="M4 6v12l8-6zM12 6v12l8-6z"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle class="s" cx="12" cy="12" r="4"/><path class="s" d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></symbol>
  <symbol id="i-vol" viewBox="0 0 24 24"><path class="f" d="M4 9.5v5h3.6l4.6 3.8V5.7L7.6 9.5z"/><path class="s" d="M15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect class="s" x="5" y="11" width="14" height="9" rx="2.5"/><path class="s" d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
  <symbol id="i-cc" viewBox="0 0 24 24"><rect class="s" x="3" y="5" width="18" height="14" rx="3.5"/><path class="s" d="M10.4 10.2a2.4 2.4 0 1 0 0 3.6M17 10.2a2.4 2.4 0 1 0 0 3.6"/></symbol>
  <symbol id="i-audio" viewBox="0 0 24 24"><path class="s" d="M9 18V6l10-2v12"/><circle class="s" cx="6.5" cy="18" r="2.5"/><circle class="s" cx="16.5" cy="16" r="2.5"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path class="s" d="M3.5 7.5a2 2 0 0 1 2-2h4l2 2.2h7a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle class="s" cx="12" cy="12" r="8.5"/><path class="s" d="M12 7.5V12l3 2"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path class="s" d="M5 7h14M5 12h14M5 17h14"/></symbol>
  <symbol id="i-seek" viewBox="0 0 24 24"><path class="s" d="M4 12h16M13 6l7 6-7 6"/></symbol>
</svg>

<div class="orbs"></div>

<main id="home">
  <div class="top">
    <div>
      <h1 class="logo"><span>Your</span> Player</h1>
      <p id="sub">Your videos, in liquid glass</p>
    </div>
  </div>
  <nav class="tabs" id="tabs">
    <button data-t="all" class="on"><svg><use href="#i-list"/></svg>All</button>
    <button data-t="folders"><svg><use href="#i-folder"/></svg>Folders</button>
    <button data-t="hist"><svg><use href="#i-clock"/></svg>History</button>
  </nav>
  <div id="scroll">
    <section id="perm" class="perm glass" hidden>
      <p>Allow access to videos so the app can show them.</p>
      <button class="chip glass" id="permbtn">Open settings</button>
    </section>
    <ul id="list"></ul>
    <p class="note" id="none" hidden>No videos found</p>
  </div>
</main>

<section id="pl" aria-label="Player">
  <div id="g"></div>
  <div class="hint l"><div class="glass"><svg width="20" height="20" style="transform:scaleX(-1)"><use href="#i-fwd"/></svg>10 sec</div></div>
  <div class="hint r"><div class="glass">10 sec<svg width="20" height="20"><use href="#i-fwd"/></svg></div></div>
  <div id="hud" class="glass"><div id="hudt"></div><div class="lv"><i></i></div></div>
  <div id="boost" class="glass"><svg><use href="#i-fwd"/></svg>2× speed</div>
  <div id="ctl">
    <div id="tb" class="bar">
      <button class="btn glass" id="bk" aria-label="Back"><svg><use href="#i-back"/></svg></button>
      <h2 id="ttl"></h2>
      <button class="btn glass" id="blk" aria-label="Lock"><svg><use href="#i-lock"/></svg></button>
      <button class="btn glass" id="brot" aria-label="Rotate"><svg><use href="#i-rot"/></svg></button>
    </div>
    <div id="mid">
      <button class="btn glass mid" id="bprev" aria-label="Previous"><svg><use href="#i-prev"/></svg></button>
      <button class="btn big" id="bplay" aria-label="Play or pause"><svg><use href="#i-play"/></svg></button>
      <button class="btn glass mid" id="bnext" aria-label="Next"><svg><use href="#i-next"/></svg></button>
    </div>
    <div id="bt">
      <div class="bar">
        <span class="tm" id="tc">0:00</span>
        <div id="sk"><div class="tr"></div><div class="fl"></div><div class="bd"></div></div>
        <span class="tm r" id="td">0:00</span>
      </div>
      <div id="row2"><button class="chip glass" id="bcc"><svg><use href="#i-cc"/></svg>CC</button><button class="chip glass" id="baud"><svg><use href="#i-audio"/></svg>Audio</button><button class="chip glass" id="bspd">1×</button></div>
    </div>
    <div id="spd" class="glass"></div>
    <div id="sheet" class="glass"></div>
  </div>
<div id="err" hidden></div>
<div id="lk"><button id="ulk" class="glass" aria-label="Unlock"><svg><use href="#i-lock"/></svg></button></div>
</section>
<div class="toast glass" id="toast"></div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const items = [];
let cur = -1, rate = 1, bright = .6, inPip = false, land = false, uiTimer = 0, uid = 0, locked = false, queue = [], qpos = -1, trk = { a: [], s: [] };

/* ---- bridge to the native side (picture-in-picture, keep screen on, rotate) ---- */
const call = (m, o) => {
  try {
    const P = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.VibeNative;
    if (P && P[m]) return P[m](o || {});
  } catch (e) {}
  return Promise.reject(new Error('no native'));
};
const nat = (m, o) => { call(m, o).catch(() => {}); };
const hasNative = () => !!(window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.VibeNative);

const pl = $('#pl');
/* the real player lives in native code; this object mimics a video element for the UI */
let seekAt = 0, volAt = 0, volSend = 0;
const v = {
  paused: true, duration: 0, videoWidth: 0, videoHeight: 0, _t: 0, _vol: .5, _rate: 1, _l: {}, _meta: false, _ended: false, _err: '',
  addEventListener(t, f) { (this._l[t] = this._l[t] || []).push(f); },
  emit(t) { (this._l[t] || []).forEach(f => f()); },
  play() { if (this.paused) { this.paused = false; nat('playing', { on: true }); this.emit('play'); } return Promise.resolve(); },
  pause() { if (!this.paused) { this.paused = true; nat('playing', { on: false }); this.emit('pause'); } },
  get currentTime() { return this._t; },
  set currentTime(x) { this._t = Math.max(0, x); seekAt = performance.now(); nat('seek', { ms: Math.round(this._t * 1000) }); this.emit('timeupdate'); },
  get playbackRate() { return this._rate; },
  set playbackRate(x) { this._rate = x; nat('rate', { v: x }); },
  get volume() { return this._vol; },
  set volume(x) {
    this._vol = x; volAt = performance.now();
    if (volAt - volSend > 40) { volSend = volAt; nat('vol', { v: x }); }
  },
  reset() { this._t = 0; this.duration = 0; this.videoWidth = 0; this.videoHeight = 0; this._meta = false; this._ended = false; this._err = ''; this.paused = false; }
};
const fmt = s => {
  if (!isFinite(s) || s < 0) s = 0;
  s = Math.floor(s);
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  return h ? h + ':' + String(m).padStart(2, '0') + ':' + String(x).padStart(2, '0') : m + ':' + String(x).padStart(2, '0');
};
const size = b => b > 1e9 ? (b / 1e9).toFixed(1) + ' GB' : Math.max(1, Math.round(b / 1e6)) + ' MB';
const use = n => '<svg><use href="#i-' + n + '"/></svg>';
let toastT = 0;
function toast(t) { const e = $('#toast'); e.textContent = t; e.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => e.classList.remove('show'), 2200); }

/* glow ring on every button press */
document.addEventListener('pointerdown', e => {
  const b = e.target.closest && e.target.closest('.btn');
  if (!b) return;
  b.classList.remove('glow'); void b.offsetWidth; b.classList.add('glow');
  setTimeout(() => b.classList.remove('glow'), 850);
}, true);

/* ---------------- library ---------------- */
let hist = {};
try { hist = JSON.parse(localStorage.getItem('yp_hist') || '{}') || {}; } catch (e) { hist = {}; }
let histSave = 0;
function saveHist(force) {
  const now = Date.now();
  if (!force && now - histSave < 5000) return;
  histSave = now;
  try {
    const ks = Object.keys(hist);
    if (ks.length > 80) ks.sort((a, b) => hist[a].t - hist[b].t).slice(0, ks.length - 80).forEach(k => delete hist[k]);
    localStorage.setItem('yp_hist', JSON.stringify(hist));
  } catch (e) {}
}
function remember() {
  if (cur < 0 || !items[cur] || !v.duration) return;
  const p = Math.round(v._t * 1000), d = Math.round(v.duration * 1000);
  if (p < 3000) return;
  hist[items[cur].vid] = (p > d - 8000) ? { p: 0, d, t: Date.now(), done: 1 } : { p, d, t: Date.now() };
}
let tab = 'all', folder = null;
function hue(name) { let h = 0; for (const c of name) h = (h * 31 + c.charCodeAt(0)) % 360; return h; }
const io = ('IntersectionObserver' in window) ? new IntersectionObserver(es => {
  for (const e of es) if (e.isIntersecting) { io.unobserve(e.target); loadThumb(e.target); }
}, { root: $('#scroll'), rootMargin: '400px' }) : null;
function paintThumb(el, it) {
  if (!it.thumb) return;
  let img = el.querySelector('img');
  if (!img) { img = document.createElement('img'); img.alt = ''; el.insertBefore(img, el.firstChild); }
  img.src = it.thumb;
}
function loadThumb(el) {
  const it = el._it;
  if (!it || it.thumb) return;
  call('thumb', { id: it.vid }).then(r => { it.thumb = r.data; paintThumb(el, it); }).catch(() => {});
}
function rowFor(it, q) {
  const li = document.createElement('li'); li.className = 'rw glass';
  const hs = hist[it.vid], pct = hs && hs.d && hs.p ? Math.min(100, Math.round(hs.p / hs.d * 100)) : 0;
  li.innerHTML = '<button class="rm"><div class="th" style="--t:' + hue(it.name) + '">' + use('play') +
    '<em>' + (it.dur ? fmt(it.dur) : '') + '</em></div>' +
    '<div class="rt"><b></b><span>' + size(it.size) + (pct ? ' · ' + pct + '% watched' : '') + '</span>' +
    (pct ? '<div class="pg"><i style="width:' + pct + '%"></i></div>' : '') + '</div></button>';
  li.querySelector('b').textContent = it.name;
  li.querySelector('.rm').onclick = () => start(items.indexOf(it), q);
  const th = li.querySelector('.th'); th._it = it;
  if (it.thumb) paintThumb(th, it); else if (io) io.observe(th); else loadThumb(th);
  return li;
}
function renderList() {
  const ul = $('#list'); ul.textContent = '';
  const frag = document.createDocumentFragment();
  let shown = 0;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === tab));
  if (tab === 'folders' && !folder) {
    const m = new Map();
    items.forEach(it => { const f = it.folder; if (!m.has(f)) m.set(f, []); m.get(f).push(it); });
    [...m.entries()].sort((a, b) => a[0].localeCompare(b[0])).forEach(([name, arr]) => {
      const li = document.createElement('li'); li.className = 'rw glass fd';
      li.innerHTML = '<button class="rm"><div class="th" style="--t:' + hue(name) + '">' + use('folder') + '</div><div class="rt"><b></b><span>' + arr.length + (arr.length === 1 ? ' video' : ' videos') + '</span></div></button>';
      li.querySelector('b').textContent = name;
      li.querySelector('.rm').onclick = () => { folder = name; renderList(); $('#scroll').scrollTop = 0; };
      frag.appendChild(li); shown++;
    });
  } else {
    let arr;
    if (tab === 'hist') arr = items.filter(it => hist[it.vid]).sort((a, b) => hist[b.vid].t - hist[a.vid].t);
    else if (tab === 'folders') arr = items.filter(it => it.folder === folder);
    else arr = items;
    if (tab === 'folders') {
      const li = document.createElement('li'); li.className = 'crumb';
      li.innerHTML = '<button class="btn glass">' + use('back') + '</button><span></span>';
      li.querySelector('span').textContent = folder;
      li.querySelector('button').onclick = () => { folder = null; renderList(); };
      frag.appendChild(li);
    }
    const q = arr.map(it => items.indexOf(it));
    arr.forEach(it => { frag.appendChild(rowFor(it, q)); shown++; });
  }
  ul.appendChild(frag);
  $('#none').textContent = tab === 'hist' ? 'Nothing watched yet' : 'No videos found';
  $('#none').hidden = shown > 0 || !hasNative() || !$('#perm').hidden;
  $('#sub').textContent = items.length ? items.length + (items.length === 1 ? ' video' : ' videos') + ' · v3' : 'Your videos, in liquid glass · v3';
}
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => { tab = b.dataset.t; folder = null; renderList(); $('#scroll').scrollTop = 0; });

/* every video on the phone (app only) */
let scanning = false;
function scanLib() {
  if (!hasNative() || scanning || pl.classList.contains('open')) return;
  scanning = true;
  call('scan').then(r => {
    scanning = false;
    if (!r.ok) { $('#perm').hidden = !!r.asked; renderList(); return; }
    $('#perm').hidden = true;
    const old = new Map(items.map(i => [i.vid, i]));
    const scanned = (r.list || []).map(o => old.get(o.id) || {
      id: ++uid, vid: o.id, name: (o.name || 'Video').replace(/\.[^.]+$/, ''), folder: o.folder || 'Other',
      size: o.size || 0, dur: (o.dur || 0) / 1000, thumb: ''
    });
    items.length = 0; items.push(...scanned); cur = -1;
    call('positions').then(m => {
      for (const k in m) { const e = m[k], c = hist[k]; if (!c || e.t > c.t) hist[k] = { p: e.p, d: e.d, t: e.t }; }
    }).catch(() => {}).then(() => renderList());
  }).catch(() => { scanning = false; });
}
window.__vperm = ok => { if (ok) scanLib(); else { $('#perm').hidden = false; renderList(); } };
$('#permbtn').onclick = () => { call('settings').catch(() => {}); };
document.addEventListener('visibilitychange', () => { if (!document.hidden) scanLib(); });

/* ---------------- player ---------------- */
function start(i, q) {
  if (i < 0 || i >= items.length) return;
  const it = items[i];
  if (q) { queue = q; }
  else if (!queue.includes(i)) queue = [i];
  qpos = queue.indexOf(i);
  if (cur >= 0 && pl.classList.contains('open')) { remember(); }
  cur = i;
  const hs = hist[it.vid], pos = hs && hs.p > 5000 && hs.d && hs.p < hs.d - 10000 ? hs.p : 0;
  $('#ttl').textContent = it.name;
  $('#err').hidden = true; v.reset(); v._t = pos / 1000; trk = { a: [], s: [] }; refreshChips();
  pl.classList.add('open');
  document.documentElement.classList.add('playing');
  rate = 1; markSpeed(); v._rate = 1;
  call('open', { id: it.vid, pos }).then(r => {
    if (r && r.vol != null) v._vol = r.vol;
    if (r && r.br != null) bright = clamp(r.br, .05, 1);
    if (pos) toast('Resuming from ' + fmt(pos / 1000));
  }).catch(e => { $('#err').textContent = 'Could not open: ' + ((e && e.message) || e); $('#err').hidden = false; });
  nat('playerOpen', { on: true }); nat('keepOn', { on: true }); nat('immersive', { on: true });
  syncPlay(); showUI(true);
  clearTimeout(waitT); waitT = setTimeout(() => { if (pl.classList.contains('open') && !v.duration && !v._err) { $('#err').textContent = 'Still loading... (no response from the player yet)'; $('#err').hidden = false; } }, 4000);
}
let waitT = 0;
function stop() {
  if (!pl.classList.contains('open')) return;
  remember(); saveHist(true);
  pl.classList.remove('open', 'ui', 'pip', 'lock');
  document.documentElement.classList.remove('playing');
  locked = false;
  v.paused = true; nat('close');
  $('#spd').classList.remove('show'); $('#sheet').classList.remove('show');
  inPip = false; land = false;
  nat('playerOpen', { on: false }); nat('pipArmed', { on: false }); nat('keepOn', { on: false }); nat('immersive', { on: false }); nat('landscape', { on: false });
  renderList();
}
window.__back = () => {
  if (locked) { toast('Screen is locked — tap the lock icon in the corner to unlock'); showUnlock(); return; }
  if ($('#sheet').classList.contains('show')) { $('#sheet').classList.remove('show'); return; }
  stop();
};
$('#bk').onclick = () => stop();

function go(d) {
  const n = qpos + d;
  if (n >= 0 && n < queue.length) start(queue[n]); else if (d > 0) { v.pause(); showUI(true); }
}
$('#bprev').onclick = () => { if (v.currentTime > 4 || qpos <= 0) v.currentTime = 0; else go(-1); showUI(true); };
$('#bnext').onclick = () => go(1);
function toggle() { if (v.paused) v.play(); else v.pause(); }
$('#bplay').onclick = () => { toggle(); showUI(true); };
v.addEventListener('timeupdate', () => { remember(); saveHist(false); });
v.addEventListener('ended', () => { remember(); saveHist(true); go(1); });
v.addEventListener('play', syncPlay); v.addEventListener('pause', syncPlay);
function syncPlay() {
  $('#bplay').innerHTML = use(v.paused ? 'play' : 'pause');
  nat('pipArmed', { on: !v.paused && pl.classList.contains('open') });
  if (!v.paused) loop(); else showUI(true);
}
v.addEventListener('loadedmetadata', () => {
  v.playbackRate = rate;
  $('#td').textContent = fmt(v.duration);
  const r = v.videoWidth && v.videoHeight ? v.videoWidth / v.videoHeight : 1.78;
  nat('ratio', { v: Math.round(clamp(r, .5, 2.3) * 100) });
});
v.addEventListener('timeupdate', paint);

/* controls show / hide */
function showUI() {
  pl.classList.add('ui');
  clearTimeout(uiTimer);
  if (!v.paused) uiTimer = setTimeout(hideUI, 3500);
}
function hideUI() { if (!dragging) { pl.classList.remove('ui'); $('#spd').classList.remove('show'); $('#sheet').classList.remove('show'); } }

/* seek bar */
const sk = $('#sk'); let dragging = false, raf = 0;
function paint() {
  if (dragging) return;
  const d = v.duration || 0, p = d ? v.currentTime / d : 0;
  setBar(p); $('#tc').textContent = fmt(v.currentTime);
}
function setBar(p) {
  const w = sk.clientWidth;
  sk.querySelector('.fl').style.width = (p * w) + 'px';
  sk.querySelector('.bd').style.left = (p * w) + 'px';
}
function loop() {
  cancelAnimationFrame(raf);
  const f = () => { if (v.paused) return; if (pl.classList.contains('ui') && !dragging) paint(); raf = requestAnimationFrame(f); };
  raf = requestAnimationFrame(f);
}
function seekTo(e) {
  const r = sk.getBoundingClientRect(), p = clamp((e.clientX - r.left) / r.width, 0, 1);
  setBar(p); $('#tc').textContent = fmt(p * (v.duration || 0)); return p;
}
sk.addEventListener('pointerdown', e => { dragging = true; sk.classList.add('drag'); sk.setPointerCapture(e.pointerId); clearTimeout(uiTimer); seekTo(e); });
sk.addEventListener('pointermove', e => { if (dragging) seekTo(e); });
const endDrag = e => {
  if (!dragging) return;
  const p = seekTo(e); dragging = false; sk.classList.remove('drag');
  if (v.duration) v.currentTime = p * v.duration;
  showUI();
};
sk.addEventListener('pointerup', endDrag);
sk.addEventListener('pointercancel', () => { dragging = false; sk.classList.remove('drag'); });

/* speed menu */
const SP = [0.5, 0.75, 1, 1.25, 1.5, 2];
$('#spd').innerHTML = SP.map(s => '<button data-s="' + s + '">' + s + '×</button>').join('');
function markSpeed() {
  $('#bspd').textContent = rate + '×';
  document.querySelectorAll('#spd button').forEach(b => b.classList.toggle('on', +b.dataset.s === rate));
}
$('#bspd').onclick = () => { $('#spd').classList.toggle('show'); clearTimeout(uiTimer); };
$('#spd').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  rate = +b.dataset.s; v.playbackRate = rate; markSpeed();
  $('#spd').classList.remove('show'); showUI();
});
markSpeed();

/* native player -> page */
window.__ps = o => {
  if (!pl.classList.contains('open')) return;
  const was = v.paused, n = performance.now();
  if (o.d > 0) v.duration = o.d / 1000;
  if (n - seekAt > 700) v._t = o.p / 1000;
  v.paused = !o.pl;
  if (o.w && (o.w !== v.videoWidth || o.h !== v.videoHeight)) { v.videoWidth = o.w; v.videoHeight = o.h; v._meta = true; v.emit('loadedmetadata'); }
  else if (!v._meta && o.d > 0) { v._meta = true; v.emit('loadedmetadata'); }
  if (v.paused !== was) v.emit(v.paused ? 'pause' : 'play');
  if (n - volAt > 1500 && o.vl != null) v._vol = o.vl;
  if (o.st === 4) { if (!v._ended) { v._ended = true; v.emit('ended'); } } else v._ended = false;
  if (o.e && o.e !== v._err) { v._err = o.e; $('#err').textContent = 'Cannot play this video: ' + o.e; $('#err').hidden = false; showUI(true); }
  if (o.st === 3 && !o.e) $('#err').hidden = true;
  v.emit('timeupdate');
};
window.__tr = o => { trk = o || { a: [], s: [] }; refreshChips(); if ($('#sheet').classList.contains('show')) drawSheet(); };
function refreshChips() { $('#bcc').classList.toggle('on', trk.s.some(t => t.sel)); }

/* subtitles + audio tracks */
let sheetKind = '';
function drawSheet() {
  const sh = $('#sheet'); sh.textContent = '';
  const add = (txt, on, fn) => { const b = document.createElement('button'); b.textContent = txt; if (on) b.className = 'on'; b.onclick = fn; sh.appendChild(b); };
  const head = t => { const e = document.createElement('h4'); e.textContent = t; sh.appendChild(e); };
  if (sheetKind === 'sub') {
    head('SUBTITLES');
    add('Off', !trk.s.some(t => t.sel), () => { call('pickText', { g: -1 }); sh.classList.remove('show'); });
    trk.s.forEach(t => add(t.n, t.sel, () => { call('pickText', { g: t.g, t: t.t }); sh.classList.remove('show'); }));
    add('+ Add subtitle file (.srt .vtt .ass)', false, () => { sh.classList.remove('show'); call('addSub').then(() => toast('Subtitle added')).catch(() => {}); });
  } else {
    head('AUDIO TRACK');
    if (!trk.a.length) { const p = document.createElement('p'); p.textContent = 'This video has only one audio track'; sh.appendChild(p); }
    trk.a.forEach(t => add(t.n, t.sel, () => { call('pickAudio', { g: t.g, t: t.t }); sh.classList.remove('show'); }));
  }
}
function openSheet(k) {
  const sh = $('#sheet');
  if (sh.classList.contains('show') && sheetKind === k) { sh.classList.remove('show'); showUI(); return; }
  sheetKind = k; $('#spd').classList.remove('show'); drawSheet(); sh.classList.add('show'); clearTimeout(uiTimer);
  nat('tracks');
}
$('#bcc').onclick = () => openSheet('sub');
$('#baud').onclick = () => openSheet('aud');

/* video lock */
let ulkT = 0;
function showUnlock() { const u = $('#ulk'); u.classList.add('show'); clearTimeout(ulkT); ulkT = setTimeout(() => u.classList.remove('show'), 2200); }
$('#blk').onclick = () => { locked = true; pl.classList.add('lock'); pl.classList.remove('ui'); $('#spd').classList.remove('show'); $('#sheet').classList.remove('show'); toast('Locked'); };
$('#lk').addEventListener('pointerdown', e => { if (!e.target.closest('#ulk')) showUnlock(); });
$('#ulk').onclick = () => { locked = false; pl.classList.remove('lock'); toast('Unlocked'); showUI(); };

/* picture in picture + rotate */
$('#brot').onclick = () => { land = !land; nat('landscape', { on: land }); showUI(); };
window.__pip = on => {
  inPip = !!on; pl.classList.toggle('pip', inPip);
  if (!inPip && !v.paused) showUI();
};
/* ---------------- gestures ----------------
   tap: controls · double tap sides: ±10s · double tap middle: play/pause
   hold: 2× while held · swipe up/down left: brightness, right: volume · swipe sideways: seek */
const g = $('#g'), hud = $('#hud'); let hudT = 0;
function showHud(icon, text, level) {
  $('#hudt').innerHTML = '<span style="display:flex;gap:6px;align-items:center">' + use(icon) + text + '</span>';
  hud.querySelector('.lv').style.display = level == null ? 'none' : '';
  if (level != null) hud.querySelector('.lv i').style.width = Math.round(level * 100) + '%';
  hud.classList.add('show'); clearTimeout(hudT); hudT = setTimeout(() => hud.classList.remove('show'), 500);
}
let brSend = 0;
function setBright(b) {
  bright = clamp(b, .05, 1);
  const n = performance.now();
  if (n - brSend > 40) { brSend = n; nat('bright', { v: bright }); }
}
function hint(side) {
  const e = document.querySelector('.hint.' + side);
  e.classList.remove('show'); void e.offsetWidth; e.classList.add('show');
}
let st = null, lpT = 0, tapT = 0, lastTap = { t: 0, side: '' }, boosting = false;
g.addEventListener('pointerdown', e => {
  g.setPointerCapture(e.pointerId);
  st = { x: e.clientX, y: e.clientY, mode: null, t: performance.now(), sv: v.volume, sb: bright, st: v.currentTime, tgt: 0 };
  clearTimeout(lpT);
  lpT = setTimeout(() => {
    if (st && !st.mode && !v.paused) { st.mode = 'boost'; boosting = true; v.playbackRate = 2; $('#boost').classList.add('show'); if (navigator.vibrate) try { navigator.vibrate(12); } catch (e) {} }
  }, 380);
});
g.addEventListener('pointermove', e => {
  if (!st) return;
  const dx = e.clientX - st.x, dy = e.clientY - st.y, W = g.clientWidth, H = g.clientHeight;
  if (!st.mode) {
    if (Math.abs(dx) < 14 && Math.abs(dy) < 14) return;
    clearTimeout(lpT);
    st.mode = Math.abs(dx) > Math.abs(dy) ? 'seek' : (st.x < W / 2 ? 'bright' : 'vol');
  }
  if (st.mode === 'seek') {
    const d = v.duration || 0;
    st.tgt = clamp(st.st + dx / W * 90, 0, d);
    const diff = Math.round(st.tgt - st.st);
    showHud('seek', (diff >= 0 ? '+' : '−') + Math.abs(diff) + 's · ' + fmt(st.tgt), null);
  } else if (st.mode === 'vol') {
    v.volume = clamp(st.sv - dy / (H * .6), 0, 1);
    showHud('vol', Math.round(v.volume * 100) + '%', v.volume);
  } else if (st.mode === 'bright') {
    setBright(st.sb - dy / (H * .6));
    showHud('sun', Math.round(bright * 100) + '%', (bright - .05) / .95);
  }
});
function release(e, cancel) {
  clearTimeout(lpT);
  if (!st) return;
  const s = st; st = null;
  if (s.mode === 'vol' || s.mode === 'bright' || s.mode === 'seek') { clearTimeout(hudT); hudT = setTimeout(() => hud.classList.remove('show'), 150); }
  if (s.mode === 'boost') { boosting = false; v.playbackRate = rate; $('#boost').classList.remove('show'); return; }
  if (s.mode === 'seek') { if (!cancel) v.currentTime = s.tgt; return; }
  if (s.mode) return;
  if (cancel) return;
  /* a tap */
  const W = g.clientWidth, x = e.clientX, side = x < W * .33 ? 'l' : x > W * .67 ? 'r' : 'c', now = performance.now();
  if (now - lastTap.t < 300 && lastTap.side === side) {
    clearTimeout(tapT); lastTap.t = 0;
    if (side === 'l') { v.currentTime = Math.max(0, v.currentTime - 10); hint('l'); }
    else if (side === 'r') { v.currentTime = Math.min(v.duration || 1e9, v.currentTime + 10); hint('r'); }
    else { toggle(); }
    return;
  }
  lastTap = { t: now, side };
  clearTimeout(tapT);
  tapT = setTimeout(() => {
    if (pl.classList.contains('ui')) hideUI(); else showUI();
  }, 260);
}
g.addEventListener('pointerup', e => release(e, false));
g.addEventListener('pointercancel', e => release(e, true));
g.addEventListener('contextmenu', e => e.preventDefault());

renderList();
scanLib();
})();
</script>
