name: Build Your Player APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare project files
        run: |
          pick() { best=""; bt=-1; for f in $1; do [ -f "$f" ] || continue; t=$(git log -1 --format=%ct -- "$f" 2>/dev/null); t=${t:-0}; if [ "$t" -ge "$bt" ]; then best="$f"; bt=$t; fi; done; if [ -n "$best" ] && [ "$best" != "$2" ]; then cp "$best" "$2"; fi; }
          pick 'index*.html' index.html
          pick 'MainActivity*.java' MainActivity.java
          pick 'VibePlugin*.java' VibePlugin.java
          pick 'CrashApp*.java' CrashApp.java
          pick 'make_icons*.py' make_icons.py
          pick 'patch_android*.py' patch_android.py
          ls -la
          for f in index.html MainActivity.java VibePlugin.java CrashApp.java make_icons.py patch_android.py; do
            if [ ! -f "$f" ]; then echo "MISSING FILE: $f"; exit 1; fi
          done
          cat > package.json <<'EOT'
          {"name":"your-player","version":"1.0.0","private":true,
           "dependencies":{"@capacitor/core":"^6.0.0","@capacitor/android":"^6.0.0"},
           "devDependencies":{"@capacitor/cli":"^6.0.0"}}
          EOT
          cat > capacitor.config.json <<'EOT'
          {"appId":"com.vibeplayer.video","appName":"Your Player","webDir":"www","server":{"androidScheme":"https"},"android":{"allowMixedContent":true}}
          EOT
      - name: Install packages and make icons
        run: |
          npm install || npm install
          pip install pillow
          python3 make_icons.py
          mkdir -p www
          cp index.html icon-192.png icon-512.png icon-maskable-512.png www/
      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Add app code and patch
        run: |
          APPID=com.vibeplayer.video
          DIR="android/app/src/main/java/$(echo $APPID | tr . /)"
          mkdir -p "$DIR"
          cp MainActivity.java VibePlugin.java CrashApp.java "$DIR/"
          sed -i "s/__PKG__/$APPID/" "$DIR/MainActivity.java" "$DIR/VibePlugin.java" "$DIR/CrashApp.java"
          python3 patch_android.py
          head -30 android/app/src/main/AndroidManifest.xml
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug || ./gradlew assembleDebug || ./gradlew assembleDebug
      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Your Player build ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
